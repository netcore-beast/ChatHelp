appId: com.chathelp.app
productName: DialogMint
copyright: Copyright © 2026 DialogMint contributors
asar: true
directories:
  output: dist/windows
files:
  - desktop/**
  - package.json
extraResources:
  - from: out
    to: out
win:
  icon: public/icon-512.png
  target:
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  artifactName: DialogMint-Setup-${version}-${arch}.${ext}
portable:
  artifactName: DialogMint-Portable-${version}-${arch}.${ext}
publish: null
