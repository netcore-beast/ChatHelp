name: CI

on:
  push:
    branches: [main, "codex/**"]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: Verify live CSP and hydration bootstrap
        run: |
          npm start > /tmp/chathelp-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID' EXIT
          npm run verify:live-csp
      - run: npm run build:native
      - run: npm run verify:static-csp
      - name: Validate Cloudflare Worker bundle and bindings
        run: npm run verify:cloudflare
      - run: npm audit --omit=dev --audit-level=high
